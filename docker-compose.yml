services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: campanha
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campanha"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      PORT: 8080
      DOMAIN: ${DOMAIN}
      ADMIN_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/campanha
      DATABASE_URL: postgres://app_rw:${APP_DB_PASSWORD}@db:5432/campanha
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MASTER_KEY_B64: ${MASTER_KEY_B64}
      HMAC_KEY: ${HMAC_KEY}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
      PUBLIC_BASE_URL: https://${DOMAIN}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: documentos
      # ---------- Integrações opcionais (MOCK se vazio) ----------
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_SMS_FROM: ${TWILIO_SMS_FROM:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      EMAIL_FROM: ${EMAIL_FROM:-sistema@e-negociosinteligentes.com.br}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SIGNATURE_PROVIDER: ${SIGNATURE_PROVIDER:-clicksign}
      CLICKSIGN_API_TOKEN: ${CLICKSIGN_API_TOKEN:-}
      CLICKSIGN_API_BASE: ${CLICKSIGN_API_BASE:-https://app.clicksign.com}
      D4SIGN_API_TOKEN: ${D4SIGN_API_TOKEN:-}
      D4SIGN_CRYPT_KEY: ${D4SIGN_CRYPT_KEY:-}
      D4SIGN_SAFE_UUID: ${D4SIGN_SAFE_UUID:-}
      D4SIGN_API_BASE: ${D4SIGN_API_BASE:-https://secure.d4sign.com.br/api/v1}

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on: [api]
    environment:
      NEXT_PUBLIC_API_URL: http://api:8080
      NODE_ENV: production

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [api, web]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  miniodata:
  caddydata:
  caddyconfig:
