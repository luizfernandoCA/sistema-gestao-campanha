#cloud-config
# Provisionamento inicial do servidor (Hetzner / Ubuntu 24.04).
# Instala Docker + plugin compose e prepara /opt/app. O app é enviado por rsync.
package_update: true
package_upgrade: false
packages:
  - ca-certificates
  - curl
  - rsync
  - ufw
runcmd:
  - curl -fsSL https://get.docker.com | sh
  - systemctl enable --now docker
  - mkdir -p /opt/app
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - touch /opt/cloud-init-done
